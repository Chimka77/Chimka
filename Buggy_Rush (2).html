/* ======== BUGGY RACING ENGINE ======== */
const LAPS=3,RW=18,RUN=9,VMAX=64,AL=26,STEER=18,DAMP=4.4,ASSIST=.6;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
let TRK=null,LAP=1000,ZN={rough:[],mud:[],rocks:[],pads:[],boxes:[]},BT=[],TR=[],MS=[],camYaw=0,camInit=false,uS=0,steerU=0,keyU=0,touchU=0,stId=null,eng=null,flash=0,SC={},CD0=6;
const pmod=s=>((s%LAP)+LAP)%LAP,ds_=(a,b)=>{const d=a-b;return((d+LAP/2)%LAP+LAP)%LAP-LAP/2};
const wrapA=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
function mkTrackData(pts){const n0=pts.length,P=i=>pts[((i%n0)+n0)%n0],raw=[];
  for(let i=0;i<n0;i++)for(let t=0;t<.999;t+=.05){const a=P(i-1),b=P(i),c=P(i+1),d=P(i+2),t2=t*t,t3=t2*t,f=k=>.5*(2*b[k]+(-a[k]+c[k])*t+(2*a[k]-5*b[k]+4*c[k]-d[k])*t2+(-a[k]+3*b[k]-3*c[k]+d[k])*t3);raw.push([f(0),f(1)])}
  let tot=0;const cum=[0];for(let i=1;i<=raw.length;i++){const p=raw[i%raw.length],q=raw[i-1];tot+=Math.hypot(p[0]-q[0],p[1]-q[1]);cum.push(tot)}
  const M=Math.round(tot/4),st=tot/M,pos=[];let j=0;
  for(let i=0;i<M;i++){const tg=i*st;while(cum[j+1]<tg)j++;const a=raw[j%raw.length],b=raw[(j+1)%raw.length],f=(tg-cum[j])/((cum[j+1]-cum[j])||1);pos.push([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f])}
  const th=[],k=[];for(let i=0;i<M;i++){const a=pos[(i-1+M)%M],b=pos[(i+1)%M];th.push(Math.atan2(b[0]-a[0],b[1]-a[1]))}
  for(let i=0;i<M;i++)k.push(-wrapA(th[(i+1)%M]-th[(i-1+M)%M])/(2*st));
  const ks=k.map((_,i)=>{let s=0;for(let q=-3;q<=3;q++)s+=k[(i+q+M)%M];return s/7});
  let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;pos.forEach(p=>{a0=Math.min(a0,p[0]);a1=Math.max(a1,p[0]);b0=Math.min(b0,p[1]);b1=Math.max(b1,p[1])});
  return{M,st,len:tot,pos,th,k:ks,bb:[a0,a1,b0,b1]}}
function tAt(s){const f=pmod(s)/TRK.st,i0=Math.floor(f),a=f-i0,i=i0%TRK.M,j=(i+1)%TRK.M,P=TRK.pos[i],Q=TRK.pos[j];
  return[P[0]+(Q[0]-P[0])*a,P[1]+(Q[1]-P[1])*a,TRK.th[i]+wrapA(TRK.th[j]-TRK.th[i])*a,TRK.k[i]+(TRK.k[j]-TRK.k[i])*a]}
function wpos(s,n){const t=tAt(s);return[t[0]-Math.cos(t[2])*n,t[1]+Math.sin(t[2])*n,t[2],t[3]]}
const curv=s=>tAt(s)[3];
function mkZones(tr){const Z={rough:[],mud:[],rocks:[],pads:[],boxes:[]},Q=i=>hs(tr*100+i);
  for(let i=0;i<3;i++){const s0=LAP*(.2+i*.27)+Q(i)*60;Z.rough.push([s0,s0+130+Q(i+9)*80])}
  const inRough=s=>Z.rough.some(z=>s>z[0]-18&&s<z[1]+18);
  for(let i=0;i<8;i++){const s=LAP*(.06+i*.115)+Q(i+20)*40;if(inRough(s))continue;Z.mud.push({s,x:0,hw:RW/2+1,hl:5+Q(i+40)*4,r:RW})}
  for(let i=0;i<12;i++){const s=LAP*(.04+i*.08)+Q(i+50)*25;if(s<50||s>LAP-30)continue;Z.rocks.push({s,x:(Q(i+60)-.5)*(RW-6),t:Math.floor(Q(i+90)*3)})}

  for(let i=0;i<9;i++){const s=LAP*(.05+i*.105);for(let c=0;c<4;c++)Z.boxes.push({s,x:(c-1.5)*3.2})}
  return Z}
const inR=s=>ZN.rough.some(z=>s>=z[0]&&s<=z[1]);

/* physics: one model for the player, AI and everyone, so everybody has the same edge */
function step(r,dt,u,go){const s=pmod(r.d),k=curv(s),kd=Math.max(.35,1-k*r.x),kp=k/kd,gp=r.grip||1;
  let tv=go?VMAX*(r.vm||1):0;const vc=Math.sqrt(AL*gp/Math.max(Math.abs(kp),1.2e-4));
  tv=Math.min(tv,vc*((r.nit>0||r.pad>0)?1.15:1));if(r.nit>0)tv*=1.4;if(r.pad>0)tv*=1.25;if(r.draft)tv*=1.04;
  let sf=1;const rough=inR(s),off=Math.abs(r.x)>RW/2+1.2;if(off){sf=.55;tv*=.62}if(rough)tv*=.86;
  for(const m of ZN.mud)if(Math.abs(ds_(m.s,s))<m.hl&&Math.abs(m.x-r.x)<m.hw){tv*=.5;sf*=.65;r.mudT=.2;r.v-=r.v*Math.min(1,dt*3.5)}
  if(r.spin>0){tv*=.4;u=0}
  if(r.fin&&r.auto)tv=Math.min(tv,30);
  r.v+=(tv-r.v)*Math.min(1,dt*(tv<r.v?2.4:(r.v<18?1.3:.85)));
  const ac=-kp*r.v*r.v*(1-ASSIST),jit=rough&&r.v>8?Math.sin(T*37+r.d*.4)*3*Math.min(1,r.v/30):0;
  r.lat+=(ac+jit+u*STEER*gp*sf*Math.min(1,.2+r.v/14)-r.lat*DAMP)*dt;r.x+=r.lat*dt;
  const lim=RW/2+RUN;if(Math.abs(r.x)>lim){r.x=Math.sign(r.x)*lim;r.lat=-r.lat*.3;r.v*=.6;if(!(r.hurt>0))r.hurt=.5}
  r.d+=r.v*dt/kd;r.ya=(r.spin>0?r.spin*9:0)+Math.atan2(r.lat,Math.max(r.v,8))*1.1;r.ph+=r.v*dt/.4;r.rough=rough}

function aiU(r,dt){const s=pmod(r.d),hw=RW/2-2.4,kA=curv(s+30+r.v*.7);let xt=clamp(kA*680,-hw,hw)*(.55+.45*(r.skill||.9));

  for(let i=0;i<ZN.boxes.length;i++){const b=ZN.boxes[i],d2=ds_(b.s,s);if(!r.item&&d2>6&&d2<40&&BT[i]<=T){xt=b.x;break}}

  for(const k of ZN.rocks){const d2=ds_(k.s,s);if(d2>3&&d2<38&&Math.abs(k.x-xt)<2.8)xt=k.x+(k.x>0?-3.4:3.4)}
  
  for(const o of TR){const d2=ds_(o.s,s);if(d2>3&&d2<30&&Math.abs(o.x-xt)<2.5)xt=o.x+(o.x>0?-3.2:3.2)}

function collide(list){const CL=4.5,CW=2.15,lc=q=>isLocal(q);for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){const a=list[i],b=list[j];if(a.fin&&b.fin)continue;const dd=a.d-b.d,dx=a.x-b.x;if(Math.abs(dd)>=CL||Math.abs(dx)>=CW)continue;
