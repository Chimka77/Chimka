<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Arcade Hub</title><meta name="theme-color" content="#07080c">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{--bg:#07080c;--tx:#eef0f6;--mu:#8b93a7;--a:#8b5cf6;--b:#ec4899;--g:linear-gradient(120deg,#8b5cf6,#ec4899);--ln:#ffffff14;--r:20px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;overflow-x:hidden;padding-bottom:calc(30px + var(--sab))}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.glow{position:fixed;inset:-20% -10% auto;height:70vh;z-index:0;pointer-events:none;background:radial-gradient(40% 50% at 25% 30%,#8b5cf633,#0000 70%),radial-gradient(35% 45% at 80% 20%,#ec489926,#0000 70%);animation:fl 12s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate3d(3%,4%,0) scale(1.08)}}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + var(--sat)) 16px 10px;background:linear-gradient(#07080cf2,#07080c99);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.logo{font-weight:900;letter-spacing:.14em;font-size:15px}.logo i{font-style:normal;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:6px}.logo span{color:var(--mu);font-weight:700}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:18px 16px}
.hi{color:var(--mu);margin-bottom:12px;min-height:20px}.hi b{color:var(--tx)}
.hero{position:relative;border-radius:26px;overflow:hidden;min-height:260px;display:flex;align-items:flex-end;border:1px solid var(--ln);box-shadow:0 30px 80px #000a,0 0 0 1px #0006;animation:up .7s both}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04);animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.14) translate(-1.5%,-1%)}}
.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#07080cf5 8%,#07080c80 55%,#0000)}
.hc{position:relative;z-index:1;padding:22px;max-width:620px}.hc h1{font-size:clamp(26px,6vw,40px);line-height:1.05;margin:8px 0}.hc p{color:#c8cde0;margin-bottom:16px}
.tag{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#ffffff18;border:1px solid var(--ln);backdrop-filter:blur(8px)}.tag.f{background:var(--g);border:0}
.play{position:relative;overflow:hidden;border:0;cursor:pointer;color:#fff;font-weight:900;letter-spacing:.06em;font-size:14px;padding:13px 26px;border-radius:14px;background:var(--g);box-shadow:0 8px 28px #8b5cf655,inset 0 1px 0 #ffffff55;transition:transform .15s,box-shadow .2s}
.play:after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,#fff0,#ffffff55,#fff0);transform:skewX(-20deg);animation:sh 3.2s infinite}
@keyframes sh{60%,100%{left:130%}}.play:hover{transform:translateY(-2px);box-shadow:0 12px 36px #ec489966}.play:active{transform:scale(.97)}
.bar{display:flex;gap:10px;align-items:center;margin:22px 0 16px;flex-wrap:wrap}
#chips{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;padding:2px;scrollbar-width:none}#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);background:#ffffff0a;color:var(--tx);padding:9px 15px;border-radius:99px;font-weight:700;font-size:13px;cursor:pointer;transition:.2s}
.chip.on{background:var(--g);border-color:transparent;box-shadow:0 6px 20px #8b5cf644}.chip small{opacity:.65;margin-left:4px}
#q{width:100%;max-width:220px;padding:10px 14px;border-radius:99px;border:1px solid var(--ln);background:#ffffff0a;color:var(--tx);font-size:14px;outline:0}#q:focus{border-color:var(--a)}
h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{position:relative;border-radius:var(--r);overflow:hidden;background:linear-gradient(180deg,#14161d,#0c0d12);border:1px solid var(--ln);transition:transform .25s,border-color .25s,box-shadow .25s;animation:up .6s both;transform-style:preserve-3d}
.card:hover{border-color:#8b5cf6aa;box-shadow:0 20px 50px #000b,0 0 40px #8b5cf626}
.th{position:relative;aspect-ratio:16/10;overflow:hidden;background:#12141a}.th img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.card:hover .th img{transform:scale(1.08)}
.th:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#0c0d12,#0000 55%)}
.bd{position:absolute;top:10px;left:10px;z-index:2;display:flex;gap:6px}.new{background:#22c55e;color:#04210f;border:0}
.cb{padding:14px 16px 16px}.cb h3{font-size:18px;margin-bottom:4px}.cb p{color:var(--mu);font-size:13px;min-height:58px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cf{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}.cf span{color:var(--mu);font-size:12px}
.card .play{padding:11px 20px}
.soon{display:flex;align-items:center;justify-content:center;text-align:center;min-height:260px;border-style:dashed;color:var(--mu);padding:20px}.soon b{display:block;font-size:30px;margin-bottom:6px}
.sk{height:300px;border-radius:var(--r);background:linear-gradient(100deg,#14161d 30%,#1d2029 50%,#14161d 70%);background-size:200% 100%;animation:sk 1.3s infinite}@keyframes sk{to{background-position:-200% 0}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
#player{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column}#player[hidden]{display:none}
#pb{display:flex;align-items:center;gap:10px;padding:calc(6px + var(--sat)) 10px 6px;background:#0a0b10;border-bottom:1px solid var(--ln);flex:none}
#pb button{border:1px solid var(--ln);background:#ffffff12;color:#fff;border-radius:10px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer}#pt{font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#frame{flex:1;width:100%;border:0;background:#000}
.ft{text-align:center;color:var(--mu);font-size:12px;margin-top:34px}
@media(max-width:560px){.hero{min-height:300px}.hc{padding:18px}#q{max-width:none}.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.cf .play{width:100%}#pw{color:var(--mu);font-size:12px}
.wc{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,#1a1530cc,#0f1018cc);border:1px solid #8b5cf644;margin-bottom:16px;backdrop-filter:blur(10px);animation:up .5s both}
.wc.off{cursor:pointer;border-style:dashed}.wc b{display:block}.wc span{color:var(--mu);font-size:12px}
.wh{display:flex;gap:12px;align-items:center}.av{width:40px;height:40px;border-radius:12px;background:var(--g);display:grid;place-items:center;font-size:18px}
.ws{display:flex;gap:22px}.ws small{display:block;color:var(--mu);font-size:10px;letter-spacing:.12em}.ws b{font-size:20px}
</style></head><body>

<div class="ft">Play. Compete. Win. · Secured by your passcode.</div>

<script>
const BASE=location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,''),CFG={manifestUrl:BASE+'tonconnect-manifest.json'};
const $=s=>document.querySelector(s),tg=window.Telegram&&Telegram.WebApp,esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let G=[],C={},cat='all',qs='';
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#07080c');tg.setBackgroundColor('#07080c');tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}
 const u=tg.initDataUnsafe&&tg.initDataUnsafe.user;if(u)$('#hi').innerHTML='Welcome back, <b>'+esc(u.first_name)+'</b> 👋'}
const info=k=>C[k]||{name:k.charAt(0).toUpperCase()+k.slice(1),icon:'🎮'},isNew=g=>g.added&&Date.now()-new Date(g.added)<14*864e5;
async function load(){const d=JSON.parse($('#reg').textContent);G=(d.games||[]).filter(g=>g&&g.id&&(g.src||g.url));C=d.categories||{};render()}
function render(){const f=G.find(g=>g.featured)||G[0];
 $('#hero').innerHTML=f?`<div class="hero"><img src="${esc(f.thumbnail)}" alt=""><div class="hc"><span class="tag f">★ Featured</span> <span class="tag">${info(f.category).icon} ${esc(info(f.category).name)}</span><h1>${esc(f.name)}</h1><p>${esc(f.description)}</p><button class="play" data-p="${esc(f.id)}">▶ PLAY NOW</button></div></div>`:'';
 const cs=[...new Set(G.map(g=>g.category||'casual'))];
 $('#chips').innerHTML=`<button class="chip ${cat==='all'?'on':''}" data-c="all">All<small>${G.length}</small></button>`+cs.map(k=>`<button class="chip ${cat===k?'on':''}" data-c="${esc(k)}">${info(k).icon} ${esc(info(k).name)}<small>${G.filter(g=>(g.category||'casual')===k).length}</small></button>`).join('');
 const q=qs.toLowerCase(),L=G.filter(g=>(cat==='all'||(g.category||'casual')===cat)&&(!q||(g.name+' '+g.description+' '+(g.tags||[]).join(' ')).toLowerCase().includes(q)));
 $('#gt').textContent=cat==='all'?'All games':info(cat).name+' games';
 $('#grid').innerHTML=L.map((g,i)=>`<article class="card" style="animation-delay:${i*70}ms"><div class="th"><img src="${esc(g.thumbnail)}" alt="${esc(g.name)}" loading="lazy"><div class="bd"><span class="tag">${info(g.category||'casual').icon} ${esc(info(g.category||'casual').name)}</span>${isNew(g)?'<span class="tag new">NEW</span>':''}</div></div><div class="cb"><h3>${esc(g.name)}</h3><p>${esc(g.description)}</p><div class="cf"><button class="play" data-p="${esc(g.id)}">▶ PLAY NOW</button></div></div></article>`).join('')+(cat==='all'&&!q?'<div class="card soon"><div><b>🚀</b>More games coming soon</div></div>':'')||'<div class="card soon"><div><b>🔍</b>No games found</div></div>'}
document.addEventListener('click',e=>{const p=e.target.closest('[data-p]'),c=e.target.closest('[data-c]');if(p)play(p.dataset.p);else if(c){cat=c.dataset.c;render()}});
$('#q').addEventListener('input',e=>{qs=e.target.value;render()});
function play(id){const g=G.find(x=>x.id===id);if(!g)return;try{tg&&tg.HapticFeedback.impactOccurred('medium')}catch(e){}
 if(g.mode==='page'&&g.url){location.href=g.url;return}
 $('#pt').textContent=g.name;gameLoad(g);$('#player').hidden=false;document.body.style.overflow='hidden';BG.stop();history.pushState({p:id},'');
 if(tg){tg.BackButton.show();tg.BackButton.onClick(closeG)}}
function gameLoad(g){const f=$('#frame');if(g.src){const e=document.getElementById(g.src);let t=e.textContent;t=e.hasAttribute('data-b64')?new TextDecoder().decode(Uint8Array.from(atob(t.trim()),c=>c.charCodeAt(0))):t.split('<\\/script>').join('<'+'/script>');f.removeAttribute('src');f.srcdoc=t}else{f.removeAttribute('srcdoc');f.src=g.url}}
function closeG(){if($('#player').hidden)return;$('#frame').removeAttribute('srcdoc');$('#frame').src='about:blank';$('#player').hidden=true;document.body.style.overflow='';BG.go();syncW();if(tg)try{tg.BackButton.hide();tg.BackButton.offClick(closeG)}catch(e){}}
$('#back').onclick=()=>history.state&&history.state.p?history.back():closeG();addEventListener('popstate',closeG);
$('#fs').onclick=()=>{const f=$('#frame');(f.requestFullscreen||f.webkitRequestFullscreen||(()=>{})).call(f)};
const BG=(()=>{const c=$('#bg'),x=c.getContext('2d');let P=[],run=1,w,h;const fit=()=>{w=c.width=innerWidth;h=c.height=innerHeight;P=Array.from({length:Math.min(46,w/22|0)},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+.6,v:Math.random()*.3+.08,a:Math.random()*.5+.15}))};fit();addEventListener('resize',fit);
 const t=()=>{if(!run)return;x.clearRect(0,0,w,h);for(const p of P){p.y-=p.v;if(p.y<-5){p.y=h+5;p.x=Math.random()*w}x.fillStyle='rgba(180,150,255,'+p.a+')';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}requestAnimationFrame(t)};t();return{stop(){run=0},go(){if(!run){run=1;t()}}}})();
const TONM='https://YOUR-DOMAIN.com/tonconnect-manifest.json';
window.HUB_MANIFEST=TONM.indexOf('YOUR-DOMAIN')>=0?'https://ton-connect.github.io/demo-dapp-with-react-ui/tonconnect-manifest.json':TONM;
let ton=null,tonBal=null,acc=null;
const fr=(a,t)=>{try{return TON_CONNECT_UI.toUserFriendlyAddress(a,t)}catch(e){return a}},sh=a=>a.length>14?a.slice(0,6)+'…'+a.slice(-6):a;
function coins(){try{const j=JSON.parse(localStorage.getItem('trm_'+acc.address));return j&&j.bal!=null?j.bal/100:0}catch(e){return 0}}
async function balance(){if(!acc)return;try{const r=await fetch('https://toncenter.com/api/v2/getAddressBalance?address='+encodeURIComponent(acc.address)),j=await r.json();tonBal=j.ok?+j.result/1e9:null}catch(e){tonBal=null}walletUI()}
function walletUI(){const w=$('#wp');if(!acc){w.innerHTML='<div class="wc off"><div class="wh"><div class="av">◆</div><div><b>Connect your wallet</b><span>See your TON and G$ coins and join prize games.</span></div></div></div>';$('#pw').textContent='';return}
 const a=fr(acc.address,acc.chain==='-3');w.innerHTML=`<div class="wc"><div class="wh"><div class="av">◆</div><div><b>${sh(a)}</b><span>${acc.chain==='-3'?'Testnet':'Mainnet'}</span></div></div><div class="ws"><div><small>G$ COINS</small><b>${coins().toFixed(2)}</b></div><div><small>TON</small><b>${tonBal==null?'—':tonBal.toFixed(2)}</b></div></div></div>`;$('#pw').textContent=sh(a)}
function syncW(){try{ton&&ton.connector&&ton.connector.restoreConnection()}catch(e){}walletUI();balance()}
document.addEventListener('click',e=>{if(e.target.closest('.wc.off'))HubX.conn()});
try{ton=new TON_CONNECT_UI.TonConnectUI({manifestUrl:HUB_MANIFEST,});ton.onStatusChange(w=>{acc=w&&w.account||null;tonBal=null;walletUI();balance()})}catch(e){$('#ton-connect').innerHTML='<button class="chip">Wallet unavailable</button>'}
walletUI();setInterval(walletUI,15000);setInterval(balance,60000);addEventListener('focus',syncW);
load();
